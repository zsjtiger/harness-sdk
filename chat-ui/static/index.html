<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strands Chat</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <span class="brand">Strands Chat</span>
          <button class="icon-btn" id="close-sidebar" aria-label="Close sidebar">×</button>
        </div>
        <button class="new-chat" id="new-chat">+ New chat</button>
        <input class="search" id="search" type="search" placeholder="Search chats" aria-label="Search chats" />
        <nav class="chat-list" id="chat-list" aria-label="Chats"></nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="icon-btn" id="open-sidebar" aria-label="Open sidebar">☰</button>
          <h1 class="title" id="title">New chat</h1>
        </header>

        <section class="messages" id="messages" aria-live="polite">
          <div class="empty" id="empty">
            <h2>What can I help with?</h2>
            <p>Ask a question to start a conversation. Chats are saved on this server.</p>
          </div>
        </section>

        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Message Strands Chat" aria-label="Message"></textarea>
          <button type="submit" id="send" aria-label="Send">Send</button>
        </form>
        <p class="status" id="status" role="status"></p>
      </main>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
