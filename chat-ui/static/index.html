<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strands Chat</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <span class="brand">Strands Chat</span>
          <button class="icon-btn" id="close-sidebar" aria-label="Close sidebar">×</button>
        </div>
        <nav class="nav" aria-label="Main">
          <button class="nav-item" id="new-chat"><span class="glyph">+</span>New chat</button>
          <button class="nav-item" id="focus-search"><span class="glyph">⌕</span>Search</button>
        </nav>
        <input class="search" id="search" type="search" placeholder="Search chats" aria-label="Search chats" />
        <div class="chat-list" id="chat-list"></div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="icon-btn" id="open-sidebar" aria-label="Open sidebar">☰</button>
          <h1 class="title" id="title">New chat</h1>
        </header>

        <section class="messages" id="messages" aria-live="polite">
          <div class="empty">
            <h2>What can I help with?</h2>
            <p>Ask a question to start a conversation. Chats are saved on this server.</p>
          </div>
        </section>

        <div class="composer-wrap">
          <div class="slash-menu" id="slash-menu" role="listbox" hidden></div>
          <div class="attachments" id="attachments"></div>
          <form class="composer" id="composer">
            <button type="button" class="round-btn" id="attach" aria-label="Attach a text file" title="Attach a text file">+</button>
            <input type="file" id="file" multiple hidden />
            <textarea id="input" rows="1" placeholder="Type / for commands" aria-label="Message"></textarea>
            <button type="button" class="round-btn" id="mic" aria-label="Voice input" title="Voice input" hidden>🎙</button>
            <button type="submit" class="send-btn" id="send" aria-label="Send" title="Send">↑</button>
          </form>
          <div class="toolbar">
            <span class="spinner" id="spinner" role="img" aria-label="Thinking" hidden></span>
            <span class="spacer"></span>
            <label class="picker">
              <span class="visually-hidden">Model</span>
              <select id="model"></select>
            </label>
            <label class="picker">
              <span class="visually-hidden">Effort</span>
              <select id="effort"></select>
            </label>
          </div>
          <p class="status" id="status" role="status"></p>
        </div>
      </main>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
